/* 系统与网络探针 (替换原有的 fetchNetworkInfo) */

async function getIP(){

    const el = document.getElementById("ip");

    function print(text, delay=300){
        return new Promise(resolve=>{
            setTimeout(()=>{
                el.innerHTML += text + "<br>";
                resolve();
            }, delay);
        });
    }// 专门的等待函数 (毫秒)
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    try{

        el.innerHTML = "";

        await print("[NET] 请稍事等待...");
        await sleep(3000);
        await print("[NET] 检测IP中...");
        await sleep(1000);

        const res = await fetch("http://ip-api.com/json/?lang=zh-CN");
        const data = await res.json();

        await print("[OK] 完成 ✔");
        await print("---------------------------");

        await print("IP: " + data.query);
        await print("国家: " + data.country);
        await print("地区: " + data.regionName);
        await print("城市: " + data.city);
        await print("运营商: " + data.isp);
        await print("组织: " + data.org);
        await print("时区: " + data.timezone);
        await print("经纬度: " + data.lat + ", " + data.lon);

        await print("---------------------------");

        // ===== 折叠详细信息 =====
        const id = "detail_" + Math.random().toString(36).slice(2,6);

        el.innerHTML += `
        <button onclick="toggleDetail('${id}',this)">
            ▶ 查看完整数据
        </button>

        <div id="${id}" style="
            display:none;
            border:1px dashed #00ff88;
            padding:8px;
            margin-top:5px;
            white-space:pre-wrap;
            max-height:200px;
            overflow:auto;
        ">
${JSON.stringify(data, null, 2)}
        </div>
        `;

        await print("[STATUS] ACCESS GRANTED");

    }catch(err){

        el.innerHTML = "⚠️ IP 获取失败";
        console.error(err);

    }

}

/* 折叠 */
function toggleDetail(id, btn){

    const el = document.getElementById(id);

    if(el.style.display === "none"){
        el.style.display = "block";
        btn.innerHTML = "▼ 收起完整数据";
    }else{
        el.style.display = "none";
        btn.innerHTML = "▶ 查看完整数据";
    }

}

/* Matrix */

const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");

canvas.height=window.innerHeight;
canvas.width=window.innerWidth;

const letters="01";
const fontSize=14;
const columns=canvas.width/fontSize;

const drops=[];

for(let x=0;x<columns;x++) drops[x]=1;

function draw(){

ctx.fillStyle="rgba(0,0,0,0.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#00ff88";
ctx.font=fontSize+"px monospace";

for(let i=0;i<drops.length;i++){

const text=letters.charAt(Math.random()*letters.length);

ctx.fillText(text,i*fontSize,drops[i]*fontSize);

if(drops[i]*fontSize>canvas.height && Math.random()>0.975)
drops[i]=0;

drops[i]++;

}

}

setInterval(draw,33);

/* 思考折叠 */

function toggleLogs(btn) {

    if (el.style.display === "none" || el.style.display === "") {

/* AI渲染 */

function renderAI(thinking,answer){

const id="think_"+Math.random().toString(36).slice(2,7);

let thinkHTML="";

if(thinking && thinking.trim()!==""){

thinkHTML=`
<div>
<button onclick="toggleThinking('${id}',this)">
▶ 展开思考
</button>

<div id="${id}" style="
display:none;
border:1px dashed #00ff88;
padding:8px;
white-space:pre-wrap;
margin-top:4px;
">
${thinking.trim()}
</div>
</div>
`;

}

return `
<div>
${thinkHTML}
<div style="white-space:pre-wrap">
${answer.trim()}
</div>
</div>
`;

}

/* API KEY */

const DEEPSEEK_KEY = "这里填入你的API密钥";  

  

/* 聊天 */

async function chat(e){

if(e.key!=="Enter") return;

const input=e.target.value.trim();
if(!input) return;

const out=document.getElementById("chatOutput");

const model=document.getElementById("modelSelect").value;

out.innerHTML+=`<div>> ${input}</div>`;

e.target.value="";

const aiLine=document.createElement("div");

out.appendChild(aiLine);

out.scrollTop=out.scrollHeight;

let finalAnswer="";
let thinking="";

try{

/* DeepSeek */

if(model.startsWith("deepseek")){

const res=await fetch(
"https://api.deepseek.com/v1/chat/completions",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+DEEPSEEK_KEY
},
body:JSON.stringify({
model:model,
stream:true,
messages:[
{role:"user",content:input}
]
})
});

const reader=res.body.getReader();
const decoder=new TextDecoder();

while(true){

const {done,value}=await reader.read();
if(done) break;

const chunk=decoder.decode(value);

const lines=chunk.split("\n");

for(const line of lines){

if(line.startsWith("data:")){

const data=line.replace("data:","").trim();

if(data==="[DONE]") break;

try{

const json=JSON.parse(data);

const reason=json.choices?.[0]?.delta?.reasoning_content;

if(reason) thinking+=reason;

const content=json.choices?.[0]?.delta?.content;

if(content){

finalAnswer+=content.replace(/^\n+/,"");

aiLine.innerHTML=renderAI(thinking,finalAnswer);

out.scrollTop=out.scrollHeight;

}

}catch{}

}

}

}

}

/* Gemini */

else{

const res=await fetch(
"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="+GEMINI_KEY,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{parts:[{text:input}]}
]
})

const data=await res.json();

finalAnswer=
data.candidates?.[0]?.content?.parts?.map(p=>p.text).join("")
||"Gemini返回异常";

aiLine.innerHTML=renderAI("",finalAnswer);

}
